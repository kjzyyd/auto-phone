name: Build Windows exe

on:
  workflow_dispatch:        # 手动触发：Actions 页面点 Run workflow
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Convert icon to ico
        run: |
          python - <<'EOF'
          from PIL import Image
          Image.open("assets/icon.jpg").convert("RGBA").save(
              "assets/icon.ico", sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          EOF

      - name: Build exe
        run: pyinstaller build/doubao_phone_agent.spec --noconfirm --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 豆包手机助手-win64
          path: dist/豆包手机助手/
